<path d="M180 692 H1075" stroke="#94a3b8" stroke-dasharray="6 5"/>
<text x="180" y="723" class="note">Серверні роботи мають окремі точки входу й моделі даних</text>
<text x="640" y="1010" class="note">Клієнти зберігають бронювання локально.</text>
<text x="640" y="1040" class="note">Стрілки показують наявні зв'язки в коді.</text>
