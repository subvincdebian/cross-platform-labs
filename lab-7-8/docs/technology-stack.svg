<path d="M 932 362 V 435" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="947" y="402" font-size="19" fill="#475569">ЛР 7-8</text>
<path d="M 465 489 H 485" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 790 489 H 770" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
